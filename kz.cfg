// Kreedz kz stuff

// general
unbind alt
alias +lj "-forward;+duck;+jump;+klook;-back;"
alias -lj "-duck;-jump;-klook;"
alias mus "say_team /stopsound"

bind w "+forward; r_cleardecals;"
bind a "+moveleft"
bind d "+moveright"
bind s "+back; r_cleardecals;"
bind capslock "+duck"
bind shift "+speed;"
bind mouse1 +lj
bind mouse2 slot1
bind mouse5 +lj
bind mwheelup +duck
bind mwheeldown "+jump"

alias mj "+duck; +jump; -duck; -jump;"
alias mjon "bind mwheelup mj;"
alias mjoff "bind mwheelup +duck;"

fps_max 400
net_graph 0
//mat_setvideomode 1920 1080 0
bind KP_END "say_team /menu"
bind KP_DOWNARROW "say_team /speed"
bind KP_PGDN "say_team /beam"
bind KP_LEFTARROW "say_team /sync"
bind KP_5 "say /hideweapon"
bind KP_6 "say_team /ljblock"

alias ljblock "say_team /ljblock"
alias beam "say_team /beam"
alias speed "say_team /speed"
alias sync "say_team /sync"
alias hidegun "say_team /hideweapon"
alias distbug "say_team !distbug"

alias zx "beam; sync; hidegun; distbug"

sensitivity 1 // 1@1600 & 4@400dpi
m_yaw 0.022

sm_mhud_settings_import eyJvd25lciI6IiIsInJldiI6MSwiZGF0YSI6WyIxIiwiLTEgMC43IiwiMjU1IDI1NSAyNTUiLCIwIDI1NSAwIiwiMSIsIi0xIDAuOCIsIjI1NSAyNTUgMjU1IiwiMjU1IDI1NSAyNTUiXX0=

//Null Strafe script

//Nothing here should be changed except if for some reason youre using different buttons
//from WASD to move.

alias checkfwd ""
alias checkback ""
alias checkleft ""
alias checkright ""

alias +mfwd "-back; +forward; alias checkfwd +forward"
alias +mback "-forward; +back; alias checkback +back"
alias +mleft "-moveright; +moveleft; alias checkleft +moveleft"
alias +mright "-moveleft; +moveright; alias checkright +moveright"

alias -mfwd "-forward; checkback; alias checkfwd"
alias -mback "-back; checkfwd; alias checkback"
alias -mleft "-moveleft; checkright; alias checkleft"
alias -mright "-moveright; checkleft; alias checkright"

alias "wstrafeon" "bind W +mfwd"
alias "sstrafeon" "bind S +mback"
alias "astrafeon" "bind A +mleft"
alias "dstrafeon" "bind D +mright"

alias "wstrafeoff" "bind W +forward"
alias "sstrafeoff" "bind S +back"
alias "astrafeoff" "bind A +moveleft"
alias "dstrafeoff" "bind D +moveright"

alias "strafeon" " wstrafeon; sstrafeon; astrafeon; dstrafeon; playvol buttons/button3 0.5; echo Strafe script ON; alias strafe strafeoff"

alias "strafeoff" " wstrafeoff; sstrafeoff; astrafeoff; dstrafeoff; playvol buttons/button2 0.5; echo Strafe script OFF; alias strafe strafeon"
alias "strafe" "strafeon"

bind "p" "strafe"

