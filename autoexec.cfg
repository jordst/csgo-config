// volume
bind m "toggle volume 0.03 0.09"
bind rightarrow "incrementvar volume 0.00 0.08 0.01"
bind leftarrow "toggle volume 0 0.09"

developer 0; er; cl_crosshaircolor 4; cl_crosshairgap -0.5; cl_crosshairsize 2; r_fullscreen_gamma 3; viewmodel_offset_z -2; eb;

host_writeconfig
exec ascii-art.cfg
