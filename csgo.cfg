// movement
bind w "+forward; r_cleardecals;"
bind a "+moveleft"
bind d "+moveright"
bind s "+back; r_cleardecals;"
bind shift "+speed;"
bind mouse1 "+attack;"
bind mwheeldown "+jump"
alias +jumpthrow "+jump;-attack;"
alias -jumpthrow "-jump"
bind mouse4 +jumpthrow
sensitivity 1.8

// console
con_enable 1
developer "1"
con_filter_enable "2"
con_filter_text "Damage Given to"
con_filter_text_out "Player:"
log_color General 00FFFFFF

//misc
net_graph 1
cl_disablefreezecam 1
cl_autowepswitch "0"
cl_hud_playercount_showcount "1"
cl_hud_bomb_under_radar "1"
cl_hud_healthammo_style "1"
hud_scaling 0.95
cl_hud_background_alpha 1
cl_hud_color 1
cl_showloadout 1
cl_hud_playercount_pos 1
cl_teamid_overhead 1
net_graphproportionalfont 1

// viewmodel
viewmodel_presetpos 3
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
cl_bob_lower_amt "5"
cl_bobamt_lat "0.33"
cl_bobamt_vert "0.14"
cl_bobcycle "2"
cl_viewmodel_shift_right_amt 0.75
cl_viewmodel_shift_left_amt 1.5
viewmodel_recoil 1
cl_righthand 1

// radar
cl_radar_always_centered 0
cl_radar_scale 0.4
cl_hud_radar_scale 1
cl_radar_icon_scale_min 1
cl_radar_rotate "1"

// mouse
m_customaccel "0"
m_customaccel_exponent "1"
m_customaccel_max "0"
m_customaccel_scale "0"
m_mouseaccel1 "0"
m_mouseaccel2 "0"
m_mousespeed "0"
m_rawinput "1"
joystick "0"
joystick_force_disabled "1"
joystick_force_disabled_set_from_options "1"
unbindalljoystick

bind KP_END "buy ak47; buy m4a1;playvol buttons/button3 0.5; "
bind KP_DOWNARROW "buy awp;playvol buttons/button3 0.5; "
bind KP_PGDN "buy ssg08;playvol buttons/button3 0.5; "
bind KP_LEFTARROW "buy mp7; buy vest; buy vesthelm; buy defuser;playvol buttons/button3 0.5; "
bind KP_5 "buy vest; buy vesthelm;playvol buttons/button3 0.5; "
bind KP_RIGHTARROW "buy galil; buy famas; buy vest; buy vesthelm;playvol buttons/button3 0.5; "
bind KP_HOME "buy deagle;playvol buttons/button3 0.5; "
bind KP_UPARROW "buy defuser; buy smokegrenade; buy hegrenade; buy flashbang; buy incgrenade; buy molotov;playvol buttons/button3 0.5; "
bind KP_PGUP "buy mp9; buy vest; buy vesthelm; buy flashbang; buy hegrenade buy defuser;playvol buttons/button3 0.5; 

echo "-----------------------"
echo "(( CSGO CONFIG REDO ))"
echo "-----------------------"