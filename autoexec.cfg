// -novid -fullscreen +exec autoexec.cfg
// wooting 09136533327d476891b909a65b058819f4c2

// general binds
bind 1 slot1 //primary
bind 2 slot2 //secondary
bind 3 "slot3;" //melee
bind 5 "slot5;" //bomb
bind 4 "buy hegrenade; slot6; slot3; slot6;" //HE grenade
bind x "buy flashbang; slot7; slot3; slot7;" // slot7 flash
bind z "buy smokegrenade; slot8; slot3; slot8;" // slot8 smoke
bind 6 "buy decoy; slot9; slot3; slot9;" // slot9 decoy
bind c "buy incgrenade; buy molotov; slot10; slot3; slot10;" // slot10 molotov/incendiary
bind q lastinv //quickswitch
bind f +lookatweapon  //inspect
bind g drop
bind e +use
bind r +reload
bind t +spray_menu
bind tab +showscores
bind del disconnect
bind mouse2 +attack2
bind capslock switchhands
bind p slot12
bind l "toggle voice_modenable 0 1"
unbind i
bind ` toggleconsole
bind b buymenu
unbind mouse3

// crosshiar
cl_crosshairthickness 0
cl_crosshairsize 1.5
cl_crosshairstyle 4
cl_crosshairgap -3
cl_crosshairalpha 255
cl_crosshair_drawoutline 0
cl_crosshair_outlinethickness 1
cl_crosshair_sniper_width 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 0
cl_crosshaircolor_b 255
cl_crosshairusealpha true
cl_crosshaircolor 5
cl_crosshairdot 0
cl_crosshairgap_useweaponvalue 0
cl_crosshair_t 0

// miscellaneous
sensitivity 1.8 // 1.66@400 0.334@2000
//zoom_sensitivity_ratio "0.818933027098955175" // 1:1 ingame sens
zoom_sensitivity_ratio "1"
m_yaw "0.022"
fps_max 400
hud_scaling 1
cl_hud_color 4
cl_showloadout 1
cl_show_clan_in_death_notice 1
cl_use_opens_buy_menu 0
cl_crosshair_recoil 0
cl_mute_enemy_team 0
mm_dedicated_search_maxping 30
r_fullscreen_gamma 3
r_show_build_info 0
cl_teamcounter_playercount_instead_of_avatars 1
engine_low_latency_sleep_after_client_tick true
cl_autohelp 0
r_drawparticles 0
cl_teamid_overhead_mode 3
cl_allow_animated_avatars 0
cl_silencer_mode 0
r_drawtracers_firstperson 1
cl_hud_telemetry_frametime_show 2
cl_show_observer_crosshair 0
cl_radar_square_with_scoreboard 0
cl_crosshair_friendly_warning 0
cl_color 0
cl_weapon_selection_rarity_color 1
cl_invites_only_mainmenu 1 
cl_invites_only_friends 1

// sound
snd_mvp_volume 0
snd_roundend_volume 0
snd_roundstart_volume 0
snd_roundaction_volume 0
snd_tensecondwarning_volume 0
snd_deathcamera_volume 0
snd_menumusic_volume 0
snd_steamaudio_enable_perspective_correction 1
snd_headphone_eq 0
snd_headphone_eq_active 2
snd_mixahead 0.00001

// aliases
alias s status
alias c clear
alias qq quit
alias dc disconnect
alias al "alias"
alias ea "exec autoexec"
alias cd "toggle cl_crosshairdot 1 0"
alias cc "incrementvar cl_crosshaircolor 1 5 1"
alias cs "incrementvar cl_crosshairstyle 1 5 1"
alias ct "toggle cl_crosshairthickness 1 0"
alias co "toggle cl_crosshair_drawoutline 1 0"
alias cot "toggle cl_crosshair_outlinethickness 1 0.5"
alias eb "cl_crosshairsize 2; cl_crosshairgap -2; cl_crosshairthickness 0"
alias er "cl_crosshairsize 3; cl_crosshairgap 0; cl_crosshairthickness 0"
alias es "cl_crosshairsize 1; cl_crosshairgap -3; cl_crosshairthickness 0;"
alias esc "cl_crosshairsize 1; cl_crosshairgap -4; ct;"
alias ec "cl_crosshairgap 0; cl_crosshair_drawoutline 1; cl_crosshaircolor 4; cl_crosshairsize 1.5"
alias bw "cl_crosshairsize 3; cl_crosshairgap -1; cl_crosshairthickness 1; cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255;"
alias white "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; eb; co;"
alias pp "incrementvar viewmodel_presetpos 1 2 1"
alias mv "viewmodel_offset_x 2.5; viewmodel_offset_y 2; viewmodel_offset_z -2;"
alias me "toggle cl_mute_enemy_team 1 0"
alias hc "incrementvar cl_hud_color 0 5 1"
alias s2 "cl_crosshairstyle 2; bind mouse1 +attack"
alias s4 "cl_crosshairstyle 4; bind mouse1 +attack"
alias s5 "bind mouse1 +attack; cl_crosshairstyle 5"
alias s6 "bind mouse1 +s6"

alias "dbg" "debugon"
alias "debugon" "cl_hud_telemetry_net_detailed 2;  cl_hud_telemetry_frametime_show 2; cl_hud_telemetry_ping_show 2; cl_hud_telemetry_net_misdelivery_show 2; alias dbg debugoff; echo [DEBUG MODE ON];"
alias "debugoff" "cl_hud_telemetry_net_detailed 1;  cl_hud_telemetry_frametime_show 2; cl_hud_telemetry_ping_show 1; cl_hud_telemetry_net_misdelivery_show 1; alias dbg debugon; echo [DEBUG MODE OFF];"
dbg

alias "lag" "lagoff"
alias "lagoff" "cl_cq_min_queue -1; rate 786432; alias lag lagon; echo [LAG MODE OFF -- SETTING RATE TO UNLIMITED];"
alias "lagon" "cl_cq_min_queue 2; rate 524288; alias lag lagoff; echo [LAG MODE ON -- SETTING RATE TO 5MB/S]"
lag


alias "contog" "cone"
alias "cone" "con_enable 1; alias contog cond; echo [con_enabled]"
alias "cond" "con_enable 0; alias contog cone; echo [con_disabled]"
bind ` "toggleconsole; contog"
bind ` toggleconsole

// network
rate 786432

// highlights damage given
con_enable 1
developer "1"
log_color General 00FFFFFF
log_color GameEventSystem 008000
log_color Symbols 400040
log_color Developer 8494FFFF

// viewmodel
viewmodel_presetpos 2
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5

// radar
cl_radar_always_centered 0
cl_radar_scale 0.4
cl_hud_radar_scale 1.2
cl_radar_icon_scale_min 1
cl_radar_rotate "1"

// movement
bind w "+forward"
bind a "+left"
bind d "+right"
bind s "+back"
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
bind ctrl "+duck"
bind shift "+sprint"
bind space +voicerecord
bind mouse1 "+attack"
bind mwheelup "player_ping"
bind mouse5 "toggle cl_radar_scale 1 0.4"
bind mwheeldown +jump

// grenade crosshair
cl_grenadecrosshair_decoy false
cl_grenadecrosshair_explosive false
cl_grenadecrosshair_fire false
cl_grenadecrosshair_flash false
cl_grenadecrosshair_keepusercrosshair false
cl_grenadecrosshair_smoke false
cl_grenadecrosshairdelay_decoy 0
cl_grenadecrosshairdelay_explosive 0
cl_grenadecrosshairdelay_fire 0
cl_grenadecrosshairdelay_flash 0
cl_grenadecrosshairdelay_smoke 0       

// alias binds
alias rifle_buy "buy ak47; buy m4a1_silencer;"

// action of keys when ALT is held
alias altM4 "bind mouse4 say (ง ° ʖ °)ง"
alias altM5 "bind mouse5 say ¯\_(º _ º)_/¯"
alias altkp1 "bind KP_1 buy m4a1"
alias altkp5 "bind KP_5 buy vest"
alias altkp6 "bind KP_6 buy ump45;"
alias altkp7 "bind KP_7 buy p250;"

// default action of keys when ALT is released
alias defM4 "bind mouse4 +spray_menu"
alias defM5 "bind mouse5 toggle cl_radar_scale 1 0.4"
alias defkp1 "bind KP_1 rifle_buy;"
alias defkp5 "bind KP_5 buy vesthelm"
alias defkp6 KP_6 "buy mp7"
alias defkp7 "bind KP_7 buy deagle;"

// enable binding of keys with ALT action
alias +altbinds "altm4; altm5; altkp1; altkp5; altkp6; altkp7"
alias -altbinds "defm4; defM5; defkp1; defkp5; defkp6; defkp7"

bind alt +altbinds

// custom crosshair style (cs5 but smaller gap)
alias +s6 "+attack; cl_crosshairgap 0"
alias -s6 "-attack; cl_crosshairgap -3"
//bind mouse1 +s6

// toggles bigger crosshair for lineups
alias "+lxh" "cl_crosshairsize 1000; cl_crosshairgap -4; cl_crosshairthickness 0"
alias "-lxh" "es; cd;"
bind NONUSBACKSLASH +lxh

// output crosshair details to console
alias crosshair_output "cl_crosshair_drawoutline; cl_crosshair_outlinethickness; cl_crosshairalpha; cl_crosshaircolor; cl_crosshairgap; cl_crosshairsize; cl_crosshairstyle; cl_crosshairthickness; cl_crosshairusealpha"

// buy
bind KP_1 "buy ak47; buy m4a1_silencer;"
bind KP_2 "buy awp;"
bind KP_3 "buy ssg08;"
bind KP_4 "buy galilar; buy famas; buy vest; buy vesthelm;"
bind KP_5 "buy vest; buy vesthelm;"
bind KP_6 "buy mp7"
bind KP_7 "buy deagle;"
bind KP_8 "buy defuser; buy smokegrenade; buy hegrenade; buy flashbang; buy incgrenade; buy molotov;"
bind KP_9 "buy mp9; buy mac10; buy vest; buy vesthelm;"
bind KP_MINUS "sellbackall"
bind KP_PLUS "rebuy"

