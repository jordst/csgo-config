// -novid -fullscreen +exec autoexec.cfg

// general binds
bind 1 slot1 //primary
bind 2 slot2 //secondary
bind 3 "slot3;" //melee
bind 5 "slot5;" //bomb
bind 4 "buy hegrenade; slot6; slot3; slot6;" //HE grenade
bind x "buy flashbang; slot7; slot3; slot7;" // slot7 flash
bind z "buy smokegrenade; slot8; slot3; slot8;" // slot8 smoke
bind 6 "buy decoy; slot9; slot3; slot9;" // slot9 decoy
bind c "buy incgrenade; buy molotov; slot10; slot3; slot10;" // slot10 molotov/incendiary
bind q lastinv //quickswitch
//bind ? invnext //select next weapon
//bind ? invprev //select previous weapon
bind f +lookatweapon  //inspect
bind g drop
bind e +use
bind r +reload
bind t +spray_menu
bind tab +showscores
bind del disconnect
bind mouse2 +attack2
bind mouse3 switchhands
bind p slot12
bind l "toggle voice_modenable 0 1"
unbind i
bind ` toggleconsole
bind b buymenu

// crosshiar
cl_crosshairthickness 0
cl_crosshairsize 2
cl_crosshairstyle 4
cl_crosshairgap -3
cl_crosshairalpha 255
cl_crosshair_drawoutline 0
cl_crosshair_outlinethickness 1
cl_crosshair_sniper_width 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 0
cl_crosshaircolor_b 255
cl_crosshairusealpha true
cl_crosshaircolor 5
cl_crosshairdot 0
cl_crosshairgap_useweaponvalue 0
cl_crosshair_t 0

// miscellaneous
sensitivity 1.66 // 1.66@400 0.334@2000
//zoom_sensitivity_ratio "0.818933027098955175" // 1:1 ingame sens
zoom_sensitivity_ratio "1"
m_yaw "0.022"
fps_max 400
hud_scaling 1
cl_hud_color 1
cl_showloadout 1
cl_show_clan_in_death_notice 1
cl_use_opens_buy_menu 0
cl_mute_enemy_team 0
mm_dedicated_search_maxping 25
r_fullscreen_gamma 3
r_show_build_info 0
cl_teamcounter_playercount_instead_of_avatars 1
engine_low_latency_sleep_after_client_tick true
r_drawparticles 0

// aliases
alias gl "say Good Luck & Have Fun!"
alias s status
alias c clear
alias qq quit
alias dc disconnect
alias ea "exec autoexec"
alias cd "toggle cl_crosshairdot 1 0"
alias cc "incrementvar cl_crosshaircolor 1 5 1"
alias cs "incrementvar cl_crosshairstyle 1 5 1"
alias ct "toggle cl_crosshairthickness 1 0"
alias co "toggle cl_crosshair_drawoutline 1 0"
alias cot "toggle cl_crosshair_outlinethickness 1 0.5"
alias eeb "cl_crosshairsize 3; cl_crosshairgap 0; cl_crosshairthickness 0.5;cl_crosshairdot 0"
alias ebb "cl_crosshairsize 1.5; cl_crosshairgap -2"
alias exb "cl_crosshairsize 3; cl_crosshairgap -2; cl_crosshairthickness 0.5;cl_crosshairdot 0"
alias eb "cl_crosshairsize 2; cl_crosshairgap -2; cl_crosshairthickness 0"
alias eb1 "cl_crosshairsize 2; cl_crosshairgap -2; cl_crosshairdot 0;"
alias es "cl_crosshairsize 1; cl_crosshairgap -3; cl_crosshairthickness 0;"
alias esc "cl_crosshairsize 1; cl_crosshairgap -4; ct;"
alias xc "cl_crosshairsize 4; cl_crosshairgap -4; cd"
alias ec "cl_crosshairgap 0; cl_crosshair_drawoutline 1; cl_crosshaircolor 4; cl_crosshairsize 1.5"
alias ecc "cl_crosshairsize 1.8; cl_crosshairgap -0.4; cl_crosshaircolor 4; cl_crosshairdot 0; cl_crosshair_drawoutline 1; cl_crosshairthickness 0; cot;"
alias wc "co;cot;cl_crosshairstyle 3;"
alias bx "cl_crosshairthickness 1; cl_crosshairsize 0; cl_crosshairstyle 4; cl_crosshairgap -4.90; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshair_sniper_width 0; cl_crosshairdot 1; cl_crosshairgap_useweaponvalue 0; cl_crosshair_t 0;"
alias bxx "cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshairgap -3.2; cl_crosshairsize 0; cl_crosshairstyle 4; cl_crosshairthickness 1.6; cl_crosshairdot 1; cl_crosshaircolor 1;"
alias bw "cl_crosshairsize 3; cl_crosshairgap -1; cl_crosshairthickness 1; cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255;"
alias bxc "bx; ct;"
alias bxe "bx;eb;cd;ct"
alias tiny "esc;ct;cd;"
alias dv "viewmodel_presetpos 3"
alias pp "incrementvar viewmodel_presetpos 1 3 1"
alias mv "viewmodel_offset_x 2.5; viewmodel_offset_y 2; viewmodel_offset_z -2;"
alias vms "toggle cl_viewmodel_shift_right_amt 2 0; toggle cl_viewmodel_shift_left_amt 2 0"
alias vb "toggle cl_bob_lower_amt 21 0"
alias st "toggle cl_crosshair_sniper_width 2 0"
alias me "toggle cl_mute_enemy_team 1 0"
alias v "toggle voice_scale 0 1"
alias btz "map aim_botz"
alias rec "exec hlae"
alias lag "logaddress_add 1"
alias vm "volume 0"
alias +hudcolour "incrementvar cl_hud_color 0 5 1"
alias +crosshaircolour "incrementvar cl_crosshaircolor 1 5 1"
alias kz "exec kz"
alias res "mat_setvideomode 1280 960 0"
alias s2 "cl_crosshairstyle 2; bind mouse1 +attack"
alias s4 "cl_crosshairstyle 4; bind mouse1 +attack"
alias s5 "bind mouse1 +attack; cl_crosshairstyle 5"
alias s6 "bind mouse1 +s6"
alias xd "apply_crosshair_code CSGO-nxV7v-cvQ8i-ocSb9-mxe2m-s8nQD"
alias go "exec csgo"
alias neek "viewmodel_presetpos 1; eb1;"
alias fair "say blog.counter-strike.net/index.php/fair-play-guidelines/"

// network
rate 786432

// highlights damage given
con_enable 1
developer "1"
log_color General 00FFFFFF
log_color GameEventSystem 008000
log_color Symbols 400040

// viewmodel
viewmodel_presetpos 2
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5

// radar
cl_radar_always_centered 0
cl_radar_scale 0.4
cl_hud_radar_scale 1.2
cl_radar_icon_scale_min 1
cl_radar_rotate "1"

// movement
bind w "+forward"
bind a "+left"
bind d "+right"
bind s "+back"
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
bind capslock "+duck"
bind shift "+sprint"
bind space +voicerecord
bind mouse1 "+attack"
bind mwheelup "player_ping"
bind mouse5 "toggle cl_radar_scale 1 0.4"
bind mwheeldown +jump

// grenade crosshair
cl_grenadecrosshair_decoy false
cl_grenadecrosshair_explosive false
cl_grenadecrosshair_fire false
cl_grenadecrosshair_flash false
cl_grenadecrosshair_keepusercrosshair false
cl_grenadecrosshair_smoke false
cl_grenadecrosshairdelay_decoy 0
cl_grenadecrosshairdelay_explosive 0
cl_grenadecrosshairdelay_fire 0
cl_grenadecrosshairdelay_flash 0
cl_grenadecrosshairdelay_smoke 0       

// alias binds

// jumpbug
alias +jb "-duck; -duck; -duck; +jump;"
alias -jb "-jump; -jump;"
//bind mouse5 "+jb"

// jump throw
alias +jt "+jump"
alias -jt "-jump"
alias +jtRelAttack "-attack;-attack2;"
alias +jtm4 "+jt; +jtRelattack"
alias -jtm4 "-jt; +jtRelattack"
bind "mouse4" "+jt; +jtRelAttack"

// forward jumpthrow
alias +wjt "+forward; +jump"
alias -wjt "-forward; -jump"
alias +wjtm4 "+wjt; +jtRelattack"
alias -wjtm4 "-wjt; +jtRelattack"
//bind "mouse4" "+wjt; +jtRelattack"

// action of keys when ALT is held
alias altM4 "bind mouse4 +wjtm4"
alias altM5 "bind mouse5 +jb"
alias altkp5 "bind KP_5 buy vest"
alias altkp1 "bind KP_1 buy m4a1"
alias altkp4 "bind KP_4 buy ump45;"
alias altkp7 "bind KP_7 buy p250;"

// default action of keys when ALT is released
alias defM4 "bind mouse4 +jtm4"
alias defM5 "bind mouse5 toggle cl_radar_scale 1 0.4"
alias defkp5 "bind KP_5 buy vesthelm"
alias rifle_buy "buy ak47; buy m4a1_silencer;"
alias defkp1 "bind KP_1 rifle_buy;"
alias defkp4 "bind KP_4 buy mp7;"
alias defkp7 "bind KP_7 buy deagle;"

// enable binding of keys with ALT action
alias +altbinds "altM4; altM5; altkp5; altkp1; altkp4; altkp7"
alias -altbinds "defM4; defM5; defkp5; defkp1; defkp4; defkp7"

bind alt +altbinds

// crouch jump
alias "+djump" "+jump ; +duck"
alias "-djump" "-jump ; -duck"
bind ctrl "+djump"

// custom crosshair style (cs5 but smaller gap)
alias +s6 "+attack; cl_crosshairgap -1"
alias -s6 "-attack; cl_crosshairgap -3"
//bind mouse1 +s6

// toggles bigger crosshair for lineups
alias "+lxh" "cl_crosshairsize 1000; cl_crosshairgap -4; cl_crosshairthickness 0"
alias "-lxh" "es;"
bind NONUSBACKSLASH +lxh

// output crosshair details to console
alias crosshair_output "cl_crosshair_drawoutline; cl_crosshair_outlinethickness; cl_crosshairalpha; cl_crosshaircolor; cl_crosshairgap; cl_crosshairsize; cl_crosshairstyle; cl_crosshairthickness; cl_crosshairusealpha"

//alias "+myjump" "+jump"
//alias "-myjump" "-jump"
bind mwheeldown "exec jumpsc"

alias +lj "+duck; exec jumpsc; checkw"
alias -lj "-duck"

// buy
bind KP_1 "buy ak47; buy m4a1_silencer;"
bind KP_2 "buy awp;"
bind KP_3 "buy ssg08;"
bind KP_4 "buy mp7;"
bind KP_5 "buy vest; buy vesthelm;"
bind KP_6 "buy galilar; buy famas; buy vest; buy vesthelm;"
bind KP_7 "buy deagle;"
bind KP_8 "buy defuser; buy smokegrenade; buy hegrenade; buy flashbang; buy incgrenade; buy molotov;"
bind KP_9 "buy mp9; buy mac10; buy vest; buy vesthelm;"
bind KP_MINUS "sellbackall"
bind KP_PLUS "rebuy"

// Radio
bind h radio3
bind j radio2
bind ] "say ㋡"
bind [ "say ☹"
bind y messagemode
bind u messagemode2

// volume
bind m "toggle volume 0.1 0.4"
bind rightarrow "incrementvar volume 0 1 0.1"
bind leftarrow "toggle volume 0 0.2"
bind n "+attack; -attack; slot5;"

es; cd;
host_writeconfig
