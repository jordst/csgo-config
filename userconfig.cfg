// cstrike
// -noforcemparms -noforcemaccel -noforcemspd -nojoy -wavonly -noipx -nomaster -condebug -high -nosync -fullscreen -w 800 -h 600 -stretchaspect -demoedit
// wooting c323c1b04611cbe71e3e87e325e55ee7e85e

alias +lj " +jump; -forward;"
alias -lj "-jump;"

alias +dj "-forward; +duck; +jump;"
alias -dj "-forward; -duck; -jump;"

// wallslide
alias +ws "-forward; +moveright; +jump;"
alias -ws "-moveright; -jump;"

// use script
alias "usescript" "+use; wait; -use; wait; +use; wait; -use; wait; +use; wait; -use; wait; +use; wait; -use; wait; -use" 

// general aliases
alias "qq" "condump; quit"
alias "dc" "disconnect"
alias "s" "status"
alias "ea" "exec userconfig.cfg"
alias "rec" "exec bxt.cfg; echo [EXECUTING BXT.CFG FOR BXT-RS]"
alias "rr" "condump; _restart"
alias "rc" "retry"
alias "ss" "stopsound"
alias "l2" "deathmatch 1; map kz_longjumps2"
alias "l3" "deathmatch 1; map kz_longjumps3"
alias "fl" "impulse 100"
alias "demorecord" "slot4; stop; record 00_online.dem;"
alias "rd" "exec recbind.cfg"

cl_cmdrate 101
cl_updaterate 102
rate 100000
fps_max 99.5
fps_override 0
cl_dlmax 0
cl_cmdbackup 4
ex_interp 0.1
brightness 1
gamma 2.5
hud_draw 1
cl_filterstuffcmd "1"
con_mono 1 
sys_ticrate 1000
r_mmx 1
r_detailtextures 1
m_filter 0
cl_showfps 0
net_graph 3
net_graphpos 1
net_graphwidth 120
hideradar 
drawradar
cl_radartype 0
hud_fastswitch 1
cl_nosmooth 1
cl_himodels 0
cl_weather 1
gunsmoke 1
cl_bob 0.01
cl_dynamiccrosshair 0
cl_crosshair_size 3
hud_saytext_time 15
con_color "255 255 255"
cl_crosshair_color "255 255 255"
m_customaccel "0"
m_customaccel_exponent "0"
m_customaccel_max "0"
m_customaccel_scale "0"
m_rawinput 1
cl_lw "1"
cl_sidespeed "400"
cl_backspeed "400"
cl_forwardspeed "400"
cl_movespeedkey "0.52"
gl_vsync "0"
kz_name "fms"
name "fms"
cl_righthand 1

// default binds
bind 1 slot1
bind 2 slot2
bind 3 slot3
bind 4 demorecord
bind 5 slot5
bind 6 slot6
bind 7 slot7
bind 8 slot8
bind 9 slot9
bind 0 "slot10"
bind w "+forward"
bind a "+moveleft"
bind d "+moveright"
bind s "+back"
bind tab "+showscores"
bind q "lastinv"
bind "ENTER" "+attack"
bind "'" "+moveup"
bind "+" "sizeup"
bind "," "buyammo1"
bind "-" "sizedown"
bind "." "buyammo2"
bind "/" "+movedown"
bind "ESCAPE" "cancelselect"
bind ";" "+mlook"
bind "=" "sizeup"
bind "[" "invprev"
bind "]" "invnext"
bind "`" "toggleconsole"
bind "b" "buy"
bind "g" "drop"
bind "n" "nightvision"
bind "r" "+reload"
bind "u" "messagemode2"
bind "y" "messagemode"
bind "~" "toggleconsole"
bind "ALT" "+strafe"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"
bind "F1" "autobuy"
bind "F2" "rebuy"
bind "F3" "chooseteam"
bind "F5" "snapshot"
bind "INS" "+klook"
bind "PGDN" "+lookdown"
bind "PGUP" "+lookup"
bind "END" "force_centerview"
bind "f" "impulse 100"

// custom binds
bind backspace "say /ungc"
bind = "say /spec"
bind k "say /keys"
bind j "say /aa"
bind f1 "say rtv"
bind f2 "say nextmap"
bind f3 "say timeleft"
bind / "say /hide"
bind o +attack2
bind del disconnect
bind mwheelup +duck
bind mwheeldown +jump
bind mouse2 slot1
bind ctrl +duck
bind v +hook
bind space +jump
bind mouse4 +dj
bind e +use
bind mouse5 "impulse 201"
unbind mouse3
bind END stop

// util / buy binds
bind "4" "hegren; weapon_hegrenade"
bind "x" "flash; weapon_flashbang"
bind "z" "sgren; weapon_smokegrenade"
bind "KP_END" "ak47;m4a1;primammo"
bind "KP_UPARROW" "hegren;flash;sgren;flash"
bind "KP_5" "vest"
bind "KP_RIGHTARROW" "vesthelm"
bind "KP_HOME" "deagle;secammo"
bind "KP_PGDN" "awp;primammo"

// modes for ljroom, kz maps, regular gunplay
alias "righthand" "right"
alias "right" "cl_righthand 1; alias righthand left"
alias "left" "cl_righthand 0; alias righthand right"
bind "capslock" "righthand"
righthand

alias "ljroom" "ljroomon"
alias "ljroomon" "bind mouse2 +duck; bind mouse1 +lj; unbind f; unbind q; bind 4 slot4; alias ljroom ljroomoff; echo [LJ ROOM BINDS ON]; playvol buttons/button3 0.5"
alias "ljroomoff" "bind mouse2 slot1; bind mouse1 +lj; bind f fl; bind q lastinv; bind 4 demorecord; alias ljroom ljroomon; echo [LJ ROOM BINDS OFF]; playvol buttons/button2 0.5"
bind "i" "ljroom"
ljroomoff;

alias "default" "bind mouse1 +attack; bind mouse2 +attack2; bind q lastinv; bind f fl; bind 4 slot4; playvol buttons/button4 0.5; echo [DEFAULT BINDS ON];"
bind l "default"

alias "togglesens" "senshigh"
alias "senslow" "sensitivity 1.75; playvol buttons/button2 0.5; alias togglesens senshigh;"
alias "senshigh" "sensitivity 2.0; playvol buttons/button3 0.5; alias togglesens senslow;"

alias "togmwdw" "bind mwheeldown +use"
alias "togmwup" "bind mwheelup slot1"
alias "togq" "bind q force_centerview"
alias "togf" "bind f togglesens"

alias "defmwdw" "bind mwheeldown +jump"
alias "defmwup" "bind mwheelup +duck"
alias "defq" "bind q lastinv"
alias "deff" "bind f fl"

alias +togglebinds "playvol buttons/button1 0.5; togmwdw; togmwup; togq; togf;"
alias -togglebinds "defmwdw; defmwup; defq; deff;"

// bind mouse5 "+togglebinds;"
// bind mouse3 "+togglebinds;"
// needed for stupid coolermaster mice remap

sensitivity 1.75
// 800 dpi 1.75

echo "[userconfig.cfg loaded]"